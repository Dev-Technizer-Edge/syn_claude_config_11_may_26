<!-- ─────────────────────────────────────────────────────────────────────────
     FILE: popup.html
     Claude Bulk Delete — Extension Popup
     Dark purple theme: matches content.js / styles.css aesthetic
──────────────────────────────────────────────────────────────────────────── -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Bulk Delete</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 260px;
      background: #0d0a1a;
      color: #e2d9f3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      padding: 18px 16px 20px;
    }

    /* ── Header ───────────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .icon {
      width: 32px;
      height: 32px;
      background: #7c3aed;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 16px rgba(124, 58, 237, 0.4);
    }

    .icon svg { display: block; }

    .title {
      font-size: 14px;
      font-weight: 700;
      color: #a78bfa;
      letter-spacing: 0.01em;
    }

    .subtitle {
      font-size: 11px;
      color: #6b5fa0;
      margin-top: 1px;
    }

    /* ── Divider ──────────────────────────────────────────────────────────── */
    .divider {
      height: 1px;
      background: rgba(167, 139, 250, 0.15);
      margin-bottom: 14px;
    }

    /* ── Instruction card ─────────────────────────────────────────────────── */
    .card {
      background: #1a1330;
      border: 1px solid rgba(167, 139, 250, 0.18);
      border-radius: 9px;
      padding: 12px 13px;
      margin-bottom: 12px;
    }

    .card-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #7c3aed;
      margin-bottom: 7px;
    }

    .steps {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .steps li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: #c4b5fd;
      font-size: 12.5px;
    }

    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      background: rgba(124, 58, 237, 0.25);
      border-radius: 50%;
      font-size: 10px;
      font-weight: 700;
      color: #a78bfa;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* ── Footer ───────────────────────────────────────────────────────────── */
    .footer {
      text-align: center;
      font-size: 11px;
      color: #4b3d6e;
    }

    .footer a {
      color: #6d55a0;
      text-decoration: none;
    }
    .footer a:hover { color: #a78bfa; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="#fff" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 11 12 14 22 4"></polyline>
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
      </svg>
    </div>
    <div>
      <div class="title">Claude Bulk Delete</div>
      <div class="subtitle">Select &amp; delete multiple chats at once</div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Steps card -->
  <div class="card">
    <div class="card-label">How to use</div>
    <ol class="steps">
      <li>
        <span class="step-num">1</span>
        <span>Navigate to <strong>claude.ai</strong></span>
      </li>
      <li>
        <span class="step-num">2</span>
        <span>Click the <strong>Bulk Select</strong> button at the bottom-right</span>
      </li>
      <li>
        <span class="step-num">3</span>
        <span>Click conversations to select them (or use <em>Select All</em>)</span>
      </li>
      <li>
        <span class="step-num">4</span>
        <span>Press <strong>Delete N</strong> and confirm</span>
      </li>
    </ol>
  </div>

  <!-- Footer -->
  <div class="footer">
    v1.0.0 &nbsp;·&nbsp; Manifest V3
  </div>

</body>
</html>
